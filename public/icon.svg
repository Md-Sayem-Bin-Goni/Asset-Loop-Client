<svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Emerald Squircle Base Gradient -->
    <linearGradient id="assetloop-bg-grad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1612" />
      <stop offset="60%" stop-color="#052E20" />
      <stop offset="100%" stop-color="#042017" />
    </linearGradient>

    <!-- Primary Over-Strand (Vibrant Mint to Emerald Gradient) -->
    <linearGradient id="loop-front-grad" x1="6" y1="14" x2="38" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Secondary Under-Strand (Deep Emerald Gradient with Shadow Depth) -->
    <linearGradient id="loop-back-grad" x1="38" y1="14" x2="6" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="55%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- 3D Overlap Drop Shadow -->
    <filter id="loop-cross-shadow" x="14" y="14" width="16" height="16" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Rounded Squircle Container with Subtle Emerald Glow Border -->
  <rect
    width="44"
    height="44"
    rx="12"
    fill="url(#assetloop-bg-grad)"
    stroke="#10B981"
    stroke-width="1.5"
    stroke-opacity="0.5"
  />

  <!-- Subtle Inner Radial Ambient Light -->
  <circle cx="22" cy="22" r="14" fill="#10B981" fill-opacity="0.12" />

  <!-- Under-Strand of the Continuous Infinity Loop -->
  <path
    d="M 22 22 C 26.5 15, 36.5 15, 36.5 22 C 36.5 29, 26.5 29, 22 22 C 17.5 15, 7.5 15, 7.5 22"
    stroke="url(#loop-back-grad)"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- Over-Strand of the Infinity Loop (Crosses through center with realistic 3D depth) -->
  <path
    d="M 7.5 22 C 7.5 29, 17.5 29, 22 22 C 26.5 15, 36.5 15, 36.5 22"
    stroke="url(#loop-front-grad)"
    stroke-width="5.5"
    stroke-linecap="round"
    filter="url(#loop-cross-shadow)"
  />

  <!-- Glowing Center Hub / Connection Spark -->
  <circle cx="22" cy="22" r="2" fill="#FFFFFF" />
  <circle cx="22" cy="22" r="3.2" stroke="#34D399" stroke-width="0.8" stroke-opacity="0.8" />
</svg>
